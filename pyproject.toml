[project]
name = "trippy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "ngrok>=1.6.0",
    "uvicorn>=0.38.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "beautifulsoup4>=4.12.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "pydantic>=2.0.0",
    "streamlit-mcp>=0.7.1",
]

[tool.uv.workspace]
members = [
    "langgraph_service",
]

[dependency-groups]
dev = [
    "streamlit>=1.62.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "llm: calls a live LLM or embedding model (exclude with -m \"not llm\")",
]
