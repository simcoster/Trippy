[project]
name = "trippy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2024.0.0",
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "uvicorn>=0.38.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "beautifulsoup4>=4.12.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "pydantic>=2.0.0",
    "streamlit-mcp>=0.7.1",
    "streamlit>=1.62.0",
]

[tool.uv.workspace]
members = [
    "langgraph_service",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# `temp/` is agent scratch by repo rule, and a git worktree checked out there
# makes pytest collect a second copy of the whole suite.
norecursedirs = ["temp", ".venv", "node_modules"]
markers = [
    "llm: calls a live LLM or embedding model (exclude with -m \"not llm\")",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Imports deliberately follow a sys.path / dotenv bootstrap.
"main.py" = ["E402"]
"scripts/streamlit_chat.py" = ["E402"]
"source/test/test_cases/test_info_site_to_availability_flow.py" = ["I001"]
# Local alembic/ makes `import alembic` first-party; generated revisions
# would fail I001 forever. Do not re-sort historical migrations.
"alembic/**" = ["I001"]
