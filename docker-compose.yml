services:
  db:
    image: pgvector/pgvector:pg16
    container_name: trippy-postgres
    environment:
      POSTGRES_USER: trippy
      POSTGRES_PASSWORD: trippy
      POSTGRES_DB: trippy
    ports:
      - "5432:5432"
    volumes:
      - trippy_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trippy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # Prices sandbox. Empty until `just load-price-sandbox` (or `just streamlit`,
  # which loads if this container is up). `quote` stays isolated from
  # Postgres. `quote-host` is non-internal so Docker will publish
  # 127.0.0.1:8503 (an internal-only network drops host port bindings).
  price-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.price-sandbox
    image: trippy-price-sandbox
    container_name: trippy-price-sandbox
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    environment:
      PRICE_SANDBOX_PORT: "8503"
    ports:
      - "127.0.0.1:8503:8503"
    networks:
      - quote
      - quote-host
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8503/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  trippy_pgdata:

networks:
  quote:
    driver: bridge
    internal: true
  quote-host:
    driver: bridge
