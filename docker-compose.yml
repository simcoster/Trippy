services:
  db:
    image: pgvector/pgvector:pg16
    container_name: trippy-postgres
    environment:
      POSTGRES_USER: trippy
      POSTGRES_PASSWORD: trippy
      POSTGRES_DB: trippy
    ports:
      - "5432:5432"
    volumes:
      - trippy_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trippy"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trippy-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://trippy:trippy@db:5432/trippy
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    env_file:
      - .env
    volumes:
      - .:/app
      - trippy_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  jobs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trippy-jobs
    environment:
      - DATABASE_URL=postgresql://trippy:trippy@db:5432/trippy
    env_file:
      - .env
    volumes:
      - .:/app
      - trippy_venv:/app/.venv
    command:
      - /app/.venv/bin/python
      - -m
      - source.ops.job_server
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  trippy_pgdata:
  trippy_venv:
