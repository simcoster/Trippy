# Alembic config — schema is owned by SQLAlchemy models in db/models.py.
# Local nuke-and-pave (when iterating on schema):
#   docker compose down -v
#   docker compose up -d db
#   alembic upgrade head
# Or: alembic downgrade base && alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql+psycopg://trippy:trippy@localhost:5432/trippy

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
