name: Scrape

# Manual ingest jobs that are not on a schedule. Availability and
# reviews have their own workflows.

on:
  workflow_dispatch:
    inputs:
      job:
        description: Ingest job (see scripts/cloud/job.sh)
        type: choice
        options:
          - claims
          - info
          - sites
          - place-ids
        default: claims
      extra_args:
        description: Extra args, e.g. --site 2
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    uses: ./.github/workflows/scrape-job.yml
    with:
      job: ${{ inputs.job }}
      extra_args: ${{ inputs.extra_args || '' }}
    secrets: inherit
