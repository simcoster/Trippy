name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Check run + job summary from dorny/test-reporter.
    permissions:
      contents: read
      checks: write
    services:
      db:
        # pgvector, not stock postgres: migration 001 runs CREATE EXTENSION vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trippy
          POSTGRES_PASSWORD: trippy
          POSTGRES_DB: trippy
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U trippy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://trippy:trippy@localhost:5432/trippy
      # Mirror the justfile so scraper tests that import amenity_enrichment /
      # info_site as top-level modules resolve the same way as local `just`.
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/source/scraper
      # graph.py builds LangGraph ChatOpenAI at import and needs a key string.
      # Scraper OpenAI clients never use this: make_nebius_openai_client raises
      # LiveLlmDisabled first unless the test is marked llm.
      NEBIUS_API_KEY: ci-not-a-secret
      # main.py raises at import if this is unset; test_webhook.py imports it
      # during collection even for skipped tests. Telegram is not live.
      TELEGRAM_TOKEN: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked

      # Every migration, on an empty database. This is the job's other half:
      # revisions that have only ever run forward on one laptop.
      - run: uv run alembic upgrade head

      # test_conflict_cases_db and test_campsite_rules_schema hang scratch
      # rows off "the first campsite"; test_the_table_exists_with_its_checks
      # also does fetchone()[0] on subject_vectors. An empty table is a
      # TypeError / a skip.
      - name: Seed one campsite and one subject
        run: uv run python scripts/ci_seed.py

      # Exclusions (do not edit the tests; existing-tests-permission.mdc):
      # - accommodation amenities/RAG need scraped embeddings, not just a schema
      # - planner_multi_room currently fails (unimplemented; docstring says so)
      # Live extractor tests are @pytest.mark.llm; the factory raises
      # LiveLlmDisabled if an unmarked test tries to call Nebius.
      - name: pytest
        run: |
          uv run pytest -m "not llm" -q \
            --junitxml=reports/pytest.xml \
            --ignore=source/test/test_cases/test_accommodation_amenities.py \
            --ignore=source/test/test_cases/test_accommodation_rag.py \
            --ignore=source/test/test_cases/test_planner_multi_room.py

      # Check on the PR ("pytest") and a table at the bottom of the run.
      # GitHub caps the markdown at 64 KB; listing every pass may collapse
      # to failed/skipped only. Runs even when pytest itself failed.
      - name: Test report
        uses: dorny/test-reporter@v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: pytest
          path: reports/pytest.xml
          reporter: python-xunit
          list-suites: all
          list-tests: all

