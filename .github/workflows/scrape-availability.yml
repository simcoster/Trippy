name: Scrape availability

# Daily vacancy scrape. SSH lives in .github/actions/scrape-job.

on:
  workflow_dispatch:
    inputs:
      extra_args:
        description: Extra args, e.g. --site 2
        required: false
        default: ""
  schedule:
    # 08:00 IDT (Israel summer). Winter (IST) this is 07:00.
    - cron: "0 5 * * *"

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scrape-job
        with:
          job: availability
          extra_args: ${{ github.event.inputs.extra_args || '' }}
          report_file: availability.md
          vm_host: ${{ secrets.TRIPPY_VM_HOST }}
          ssh_user: ${{ secrets.TRIPPY_SSH_USER }}
          ssh_key: ${{ secrets.TRIPPY_SSH_KEY }}
          trippy_root: ${{ vars.TRIPPY_ROOT || '/opt/trippy' }}
