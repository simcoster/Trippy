name: LLM tests (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "pytest target, e.g. source/test/test_cases/test_unit_rules.py"
        required: false
        default: ""

permissions:
  contents: read
  checks: write

jobs:
  llm:
    environment: llm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trippy
          POSTGRES_PASSWORD: trippy
          POSTGRES_DB: trippy
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U trippy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://trippy:trippy@localhost:5432/trippy
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/source/scraper
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # main.py raises at import if this is unset; collection imports it.
      TELEGRAM_TOKEN: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Require Nebius key
        run: test -n "${NEBIUS_API_KEY}"
      - run: uv run alembic upgrade head
      - name: Seed one campsite and one subject
        run: uv run python scripts/ci_seed.py
      - name: pytest
        env:
          PYTEST_TARGET: ${{ inputs.target }}
        run: |
          if [ -n "${PYTEST_TARGET}" ]; then
            uv run pytest -m llm -q --junitxml=reports/pytest.xml -- "${PYTEST_TARGET}"
          else
            uv run pytest -m llm -q --junitxml=reports/pytest.xml
          fi
      - name: Test report
        uses: dorny/test-reporter@v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: pytest (llm)
          path: reports/pytest.xml
          reporter: python-xunit
          list-suites: all
          list-tests: all
