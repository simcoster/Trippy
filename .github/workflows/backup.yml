name: Backup Postgres

# One dump per day. Public schema on the VM → disk + object storage.
# 14:00 IDT (Israel summer). Winter (IST) this is 13:00.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dump public schema on the VM
        uses: appleboy/ssh-action@v1.2.2
        env:
          TRIPPY_ROOT: ${{ vars.TRIPPY_ROOT || '/opt/trippy' }}
        with:
          host: ${{ secrets.TRIPPY_VM_HOST }}
          username: ${{ secrets.TRIPPY_SSH_USER }}
          key: ${{ secrets.TRIPPY_SSH_KEY }}
          command_timeout: 30m
          envs: TRIPPY_ROOT
          script: |
            set -eu
            cd "${TRIPPY_ROOT}"
            export TRIPPY_ROOT
            export TRIPPY_COMPOSE_FILE=docker-compose.prod.yml
            export TRIPPY_BACKUP_DIR="${HOME}/.trippy-backups"
            export TRIPPY_BACKUP_REQUIRE_S3=1
            export BACKUP_REPORT_PATH="${HOME}/.trippy-backups/last.md"
            if [ -f .env ]; then
              set -a
              # shellcheck disable=SC1091
              . ./.env
              set +a
            fi
            bucket=$(printf '%s' "${BACKUP_S3_BUCKET:-}" | tr -d '\r')
            if [ -z "${bucket}" ]; then
              echo "BACKUP_S3_BUCKET is unset in ${TRIPPY_ROOT}/.env" >&2
              echo "Uncomment the object-store keys (see .env.example) and re-run." >&2
              exit 1
            fi
            sh scripts/cloud/backup.sh

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          HOST: ${{ secrets.TRIPPY_VM_HOST }}
          SSH_USER: ${{ secrets.TRIPPY_SSH_USER }}
          SSH_KEY: ${{ secrets.TRIPPY_SSH_KEY }}
        run: |
          set -eu
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=/dev/null \
            "${SSH_USER}@${HOST}" \
            "test -f \"\$HOME/.trippy-backups/last.md\" && cat \"\$HOME/.trippy-backups/last.md\" || echo \"_Backup did not write an object-store report (dump or upload failed)._\"" \
            >> "$GITHUB_STEP_SUMMARY"
