name: Scrape reviews

# Daily Google reviews scrape, then embed unclassified rows.
# SSH lives in .github/actions/scrape-job. --embed-only skips Google.

on:
  workflow_dispatch:
    inputs:
      extra_args:
        description: Extra args, e.g. --campsite-id 2 or --embed-only
        required: false
        default: ""
  schedule:
    # 09:00 IDT (Israel summer). Winter (IST) this is 08:00.
    - cron: "0 6 * * *"

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scrape-job
        with:
          job: reviews
          extra_args: ${{ github.event.inputs.extra_args || '' }}
          report_file: reviews.md
          vm_host: ${{ secrets.TRIPPY_VM_HOST }}
          ssh_user: ${{ secrets.TRIPPY_SSH_USER }}
          ssh_key: ${{ secrets.TRIPPY_SSH_KEY }}
          trippy_root: ${{ vars.TRIPPY_ROOT || '/opt/trippy' }}
