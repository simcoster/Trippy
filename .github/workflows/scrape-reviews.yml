name: Scrape reviews

# Daily Google reviews scrape, then embed unclassified rows.
# SSH and report live in scrape-job.yml. --embed-only skips Google.

on:
  workflow_dispatch:
    inputs:
      extra_args:
        description: Extra args, e.g. --campsite-id 2 or --embed-only
        required: false
        default: ""
  schedule:
    # 09:00 IDT (Israel summer). Winter (IST) this is 08:00.
    - cron: "0 6 * * *"

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    uses: ./.github/workflows/scrape-job.yml
    with:
      job: reviews
      extra_args: ${{ github.event.inputs.extra_args || '' }}
      report_file: reviews.md
      backup: false
    secrets: inherit
