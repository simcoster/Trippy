name: Scrape job

# Reusable SSH-to-VM scrape. Callers: scrape-availability.yml,
# scrape-reviews.yml, scrape.yml (manual other jobs).

on:
  workflow_call:
    inputs:
      job:
        description: job.sh name (availability, reviews, claims, …)
        type: string
        required: true
      extra_args:
        description: Extra args, e.g. --site 2
        type: string
        required: false
        default: ""
      report_file:
        description: Markdown under ~/.trippy-scrape to copy into the Summary
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Run scrape on the VM
        uses: appleboy/ssh-action@v1.2.2
        env:
          JOB: ${{ inputs.job }}
          EXTRA: ${{ inputs.extra_args }}
          TRIPPY_ROOT: ${{ vars.TRIPPY_ROOT || '/opt/trippy' }}
        with:
          host: ${{ secrets.TRIPPY_VM_HOST }}
          username: ${{ secrets.TRIPPY_SSH_USER }}
          key: ${{ secrets.TRIPPY_SSH_KEY }}
          command_timeout: 180m
          envs: JOB,EXTRA,TRIPPY_ROOT
          script: |
            set -eu
            cd "${TRIPPY_ROOT}"
            REPORT_DIR="${HOME}/.trippy-scrape"
            mkdir -p "${REPORT_DIR}"
            rm -f "${REPORT_DIR}/availability.md" "${REPORT_DIR}/reviews.md"
            if [ -n "${EXTRA}" ]; then
              docker compose -f docker-compose.prod.yml --env-file .env \
                --profile scrape run --rm \
                -v "${REPORT_DIR}:/reports" \
                -e AVAILABILITY_REPORT_PATH=/reports/availability.md \
                -e REVIEWS_REPORT_PATH=/reports/reviews.md \
                scrape "${JOB}" ${EXTRA}
            else
              docker compose -f docker-compose.prod.yml --env-file .env \
                --profile scrape run --rm \
                -v "${REPORT_DIR}:/reports" \
                -e AVAILABILITY_REPORT_PATH=/reports/availability.md \
                -e REVIEWS_REPORT_PATH=/reports/reviews.md \
                scrape "${JOB}"
            fi

      - name: Job summary
        env:
          HOST: ${{ secrets.TRIPPY_VM_HOST }}
          SSH_USER: ${{ secrets.TRIPPY_SSH_USER }}
          SSH_KEY: ${{ secrets.TRIPPY_SSH_KEY }}
          REPORT_FILE: ${{ inputs.report_file }}
        run: |
          set -eu
          if [ -z "${REPORT_FILE}" ]; then
            echo "_No scrape report for this job._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=/dev/null \
            "${SSH_USER}@${HOST}" \
            "test -f \"\$HOME/.trippy-scrape/${REPORT_FILE}\" && cat \"\$HOME/.trippy-scrape/${REPORT_FILE}\" || echo \"_No scrape report (the scrape failed before writing one)._\"" \
            >> "$GITHUB_STEP_SUMMARY"
